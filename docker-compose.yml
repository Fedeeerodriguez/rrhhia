name: rrhhia-cv

# Demo A. Levanta con:
#   ANTHROPIC_API_KEY=sk-... docker compose up -d --build
# o dejando la clave en un .env al lado de este archivo.
#
# Web:  http://localhost:8081
# API:  http://localhost:8001/docs

services:
  backend:
    build: ./backend
    environment:
      # Sin clave la extraccion cae al motor heuristico y la demo igual funciona.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: sqlite:////datos/rrhhia.db
    volumes:
      - datos:/datos
    ports:
      # Expuesto solo para poder abrir /docs durante la demo.
      - "8001:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  datos:
