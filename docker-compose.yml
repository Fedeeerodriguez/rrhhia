name: rrhhia-cv

# Demo A -- CV en PDF
#
# Este archivo NO publica puertos del host: en EasyPanel el trafico entra por el
# dominio, y publicarlos hace que el panel avise de conflictos entre servicios.
#
# En EasyPanel:
#   Repo   https://github.com/Fedeeerodriguez/rrhhia.git
#   Rama   demo-cv
#   Y el dominio apuntado al servicio `web`, puerto 80.
#
# En tu maquina, con los puertos del override:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   Web  http://localhost:8081      API  http://localhost:8001/docs
#
# La clave va por variable de entorno, nunca en un archivo del repo:
#   ANTHROPIC_API_KEY=sk-...

services:
  backend:
    build: ./backend
    environment:
      # Sin clave la extraccion cae al motor heuristico y la demo igual funciona.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: sqlite:////datos/rrhhia.db
    volumes:
      - datos:/datos
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      # Nombre interno del backend. En EasyPanel se cambia por el del servicio.
      API_UPSTREAM: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos:
